name: Release validation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  identity:
    name: release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify tag and public version surfaces
        run: |
          python3 tools/test_check_release.py
          python3 tools/check_release.py --release --tag "${GITHUB_REF_NAME}"

  gates:
    name: ${{ matrix.os }} release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install tmux on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run serialized tests
        run: cargo test --locked --all-targets --all-features -- --test-threads=1
      - name: Run deterministic compatibility and package harness tests
        run: |
          python3 tools/test_live_product_smoke.py
          python3 tools/test_check_package.py
          python3 tools/test_check_release.py
          python3 tools/check_package.py

      - name: Build installed release artifact
        run: cargo build --release --locked
      - name: Package and test the publishable source artifact
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked
          package_crates=(target/package/herdr-tether-*.crate)
          if [[ "${#package_crates[@]}" -ne 1 || ! -f "${package_crates[0]}" ]]; then
            echo "expected exactly one packaged herdr-tether crate" >&2
            exit 1
          fi
          package_manifests=(target/package/herdr-tether-*/Cargo.toml)
          if [[ "${#package_manifests[@]}" -ne 1 || ! -f "${package_manifests[0]}" ]]; then
            echo "expected exactly one packaged herdr-tether manifest" >&2
            exit 1
          fi
          cp "${package_crates[0]}" "$RUNNER_TEMP/first.crate"
          rm "${package_crates[0]}"
          cargo package --locked
          cmp "$RUNNER_TEMP/first.crate" "${package_crates[0]}"
          cargo test --locked --manifest-path "${package_manifests[0]}" -- --test-threads=1
          cargo install \
            --path "$(dirname "${package_manifests[0]}")" \
            --locked \
            --root "$RUNNER_TEMP/package-install"
          "$RUNNER_TEMP/package-install/bin/herdr-tether" --version

  msrv:
    name: rust-1.88 release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version --verbose
          cargo --version

      - name: Check all targets on the minimum Rust version
        run: cargo check --locked --all-targets --all-features
