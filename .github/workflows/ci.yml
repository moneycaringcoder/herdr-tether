name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install tmux on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests without cross-test process contention
        run: cargo test --locked --all-targets --all-features -- --test-threads=1

      - name: Run deterministic compatibility and package harness tests
        run: |
          python3 tools/test_live_product_smoke.py
          python3 tools/test_check_package.py
          python3 tools/test_check_release.py
          python3 tools/check_release.py --tag v0.5.0
          python3 tools/test_check_docs.py
          python3 tools/test_check_public_contracts.py
          python3 tools/check_docs.py

      - name: Build the installed release artifact
        run: cargo build --release --locked

  msrv:
    name: rust-1.88
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version --verbose
          cargo --version

      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-msrv-${{ hashFiles('Cargo.lock') }}

      - name: Check all targets on the minimum Rust version
        run: cargo check --locked --all-targets --all-features

  install-sources:
    name: package and pinned-commit installs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-install-sources-${{ hashFiles('Cargo.lock') }}

      - name: Verify publishable package contents
        run: |
          python3 tools/test_check_package.py
          python3 tools/check_package.py

      - name: Build reproducible package and install it
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked
          package_crates=(target/package/herdr-tether-*.crate)
          package_manifests=(target/package/herdr-tether-*/Cargo.toml)
          if [[ "${#package_crates[@]}" -ne 1 || ! -f "${package_crates[0]}" ]]; then
            echo "expected exactly one packaged herdr-tether crate" >&2
            exit 1
          fi
          if [[ "${#package_manifests[@]}" -ne 1 || ! -f "${package_manifests[0]}" ]]; then
            echo "expected exactly one packaged herdr-tether manifest" >&2
            exit 1
          fi
          cp "${package_crates[0]}" "$RUNNER_TEMP/first.crate"
          rm "${package_crates[0]}"
          cargo package --locked
          cmp "$RUNNER_TEMP/first.crate" "${package_crates[0]}"
          cargo install \
            --path "$(dirname "${package_manifests[0]}")" \
            --locked \
            --root "$RUNNER_TEMP/package-install"
          "$RUNNER_TEMP/package-install/bin/herdr-tether" --version
          python3 tools/check_public_contracts.py \
            --archive "${package_crates[0]}" \
            --binary "$RUNNER_TEMP/package-install/bin/herdr-tether"

      - name: Install from the exact checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA is not a full lowercase commit SHA" >&2
            exit 1
          fi
          cargo install \
            --git "file://$GITHUB_WORKSPACE" \
            --rev "$GITHUB_SHA" \
            --locked \
            --root "$RUNNER_TEMP/commit-install"
          "$RUNNER_TEMP/commit-install/bin/herdr-tether" --version
