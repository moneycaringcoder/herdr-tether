    .word { fill: #172033; font: 700 76px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: -4px; }
    .byline { fill: #475569; font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
