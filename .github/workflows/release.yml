name: Release validation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  identity:
    name: release identity
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify tag and public version surfaces
        run: python3 tools/check_release.py --tag "${GITHUB_REF_NAME}"

  gates:
    name: ${{ matrix.os }} release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run serialized tests
        run: cargo test --locked --all-targets --all-features -- --test-threads=1

      - name: Build installed release artifact
        run: cargo build --release --locked

  msrv:
    name: rust-1.88 release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version --verbose
          cargo --version

      - name: Check all targets on the minimum Rust version
        run: cargo check --locked --all-targets --all-features
